# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# Pin the Gradle daemon JVM to the local Zulu JDK 25.
org.gradle.java.home=D\:\\Zulu\\zulu-25

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.2.0+26.1.2
group=dev.h2o_cl

# Java target per Minecraft family: 21 for 1.21.x, 25 for 26.x
java_release=25

# ModMenu version per Minecraft version (see Modrinth project "modmenu")
modmenu_version=18.0.0
